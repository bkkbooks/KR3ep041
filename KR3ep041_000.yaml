front:
  text: 序鄒君亦仲壽世為懷常曰學書學劍卻能獨善其身不若學易學醫可以利物天人深究洞悉陰陽可謂不空到仲景堂前而歸足為斯民耽生者矣吾儕自與研究醫學以來諸多受益茅塞頓開靈素金匱諸書最難者為之廣集後賢高論以為證明觀其臨症處方任病情疑難複雜均能直其所蛛絲馬跡條緒立尋其出方也務立於不敗之地又能直中病情略無偏寒偏熱之弊鮮不效同桴鼓而沉疴多賴以起到處有口皆碑也值茲民生主義急圖實現而醫道當為最切要之點故力勸其將近年手積醫案悉行錄出代付石印局印行以貢同道需覽勿使明醫久不見聞於世起見即可為後學臨症指南之針矣成案雖不甚多絕無一案不驗者案中所論病理脈理藥理均淺而易明不待閱者多費推敲也民國三十一年癸未五月湘邵陽王巨臣鄒代隆鄒竹君同序自序醫乃格物致知之學博而且淵陰陽氣化之理微而且隱非費十年討求經驗者何能司人生命妄談燮理哉亦仲幼讀儒書長窮醫學數十載不釋卷志在業精於勤期無隕越凡臨一症務先詳其病情所在繼乃謀藥適宜原效夫喻氏先議病後議藥之旨豈敢一毫鹵莽塞責哉自應診以來療治雖多而成案者終屬寥寥實關夫具眼人稀為負始終責者最鮮偶得信任之家付我二三調治然後病情是否有護方藥是否相宜庶能洞悉原委即可完成一案形諸篇幅也不信任者日更數醫病情方藥結果無從探悉雖欲成案多付缺如之恨良用惜然且諸案中類多逝症皆由抱病者徒執己見以取敗實非病之真不能起明明病宜攻者自欲補之病宜涼者自欲熱之病宜轉症方愈者自欲速效之雖予開導置若罔聞只有棄而不治任其另擇高明焉耳他如信巫不信醫之流或重財輕命之輩及驕矜不倫於理之子先哲都云不治僕亦面遇甚多常使拂袖而往安能與談規矩準繩之治哉種種原因醫欲得成一案豈不難乎更可嘆者今之延醫不必識醫作醫不必識症箇中關係殊非淺鮮吾為目擊心傷者久之因不揣譾陋故將近年稍積經驗各案悉錄出付梓所說病理藥理脈理是否有當惶愧時深中有病人成見之誤迷信之風重財之弊最礙生命前途期略聞於世或可啟聾而震聵是猶以一葦而障狂瀾也知我罪我不完顧諸民國三十一年癸未五月湘邵陽隆回鄉鄒亦仲識於芙塘潮水屋
