body:
  text: 久痢傷腎陽王撫臣室妊娠八月久患滯下小愈旬余病仍如前頗甚於夜經他醫投以補中益氣症無增減診得兩手脈均緩和惟右尺沉小乃腎陽見傷欠於蒸動胃關致後陰開合失度倘關積滯為患服補中益氣能不加劇乎腎屬陰經故病甚於夜之陰分也與桂附八味佐當歸濡血艾葉和胎一劑知二劑已久痢傷腎陰王永修滯下月餘腹痛後重甚於夜間脈象左尺沉小紊亂寸關與右手細弦此久痢傷乎腎陰木失含濡乘脾作痛之候惟右脈之弦象可虞中虛難受木侮也法宜先治其腎使根蒂不搖方無險浪仍與桂附八味重陰柔而輕陽品調水火均平無使偏勝方二陰之開合有節肝木之庇廕有源何至鬱而乘土病當自己因左尺為根本所在脈象如斯恐生不測特預為說破休咎以防異議果此方有效可冀引年否則無以藥為也幸服三劑左尺紊亂之形不見再疏補中益氣囑其晚服朝進八味地黃脾腎同治藥力方不至混互耳數服收功聞痢甫愈旋又以他疾終肝燥內傷魏肖氏久患咳血胸悶善怒白帶如注汛事不調脈象左緩滑右弦細乃肝氣不疏肝血最燥肺氣不布津結成痰之候也且腎陰耗傷滋填匪易肝旺難馴情性不柔力勸其理佛參禪可省卻謀慮單眠息怒勿再傷腎肝不可徒恃力以怡情而填空乏也法與通陽滌飲使胸中之板滯漸寬介類潛陽舒郁肝陽之易升莫泛以沙參菖蒲寸冬蛤蜊龜板鱉甲芍蓯蓉枸杞等出入為方調治經年日有起色雖當青帝乘權之及時浮越現已兩度春光究無鴛飛魚躍之患果長此以往預祝復康有日不知保養毅力何如妊娠暈脹鄭某室胸腹脹疼時有暈眩診其脈緩滑調勻似屬有子之象詢汛事果三月未行殆肝血移作蔭胎之用暫會肝燥侮於胃而作脹疼越於巔而作暈眩之症也法與養血濡肝潛陽理氣之品二劑而安肝腎俱敗逝症肖蕃生老人八旬有餘素以醫學濟世貧富不取壬午二月往謁其家睹上面部色瘁枯黃下面部亦同平昔嗟屬老年不祿之徵迄葭月竟患夜臥不能轉側小溲淋瀝欠通失眠腳軟步履維艱手足筋惕舌尖頗紅左關脈洪右手緊大此屬肝腎兩憊骨損筋頹肝主筋腎主骨足不任地筋骨頹敗之象心陽亢甚坎離不交之象舌尖獨紅心火亢極不與坎陰相媾夜不成眠也再四思籌腳軟無力八脈之空虛宜補小溲澀痛木火之縱橫宜制因老年難任苦寒亦恐有妨胃氣只得溫養奇經及舒筋活絡為方一帖病無增減脈頗緩和二三帖可得熟眠舌尖不赤脈象更平知心陽上亢下與坎陰相媾參只筋骨頹損須待補培擬可暫無危險冀就康復方辭歸夾旬即聞噩耗後得家人說及此老吃甑蒸飯兩餐後病遂加劇不知果因此憤事否吾考甑飯之劣性所存無非為火氣烘蒸而熟上升之熱性較勝也食入胃中自能引熱上行況此老之心陽先亢於上肝火又熾於下經藥力稍為戢小者得此上升熱性助之何難掀發於俄頃焉想慣吃甑飯者當不見礙慎口腹之人可引為殷鑑氣愆為病儼似外邪鄒賀氏年六旬余忽脘痛最急寒熱而嘔舌上津枯渴不喜飲不便不飢呻呤不已脈象洪數有力詢其頭不痛症非傷寒診其脈不弦食滯胃中氣機凝結上逆則為嘔吐滯於脘間則為痛疼滯於寒熱失其流通輸布則為舌燥津枯失其升降樞轉則為不便不飢以上諸候無非為氣愆其行度以釀成之法與沙參竹茹花粉枇葉紫蘇橘紅薑樸絲瓜絡二冬等輕展清宣氣機得以活潑俾氣行則熱自泄而津自生矣丹溪所謂氣有餘即有火於斯益信服二劑霍然也愈後數日又誤食飯豆燉湯脘痛更甚舌燥更加仍於前方內加麥芽神麯而瘥夫氣結津枯之候昔吳頗有言及亦屬概略至孟英始闡發病機最廣治法亦周卓識真超越古人上矣濕熱下流會陰症張某君久患白濁濕熱素充甫將就愈又傷於房事遠行濕熱餘波遂乘虛流入尾底會陰之穴溺時前後二陰牽連硬塞作痛六脈緩滑左尺沉小的是腎陰先虛而濕熱乘機流入之象方擬六味地黃以填陰再佐黑醜茴香以逐下竄之邪至陰之會非辛溫猛烈不能直搗黃龍也二劑即慶霍然遂減去二味仍多服六味湯以善後冬溫失治成癰劉青藜室臘月間有不飢不食便塞難出之恙初不介意未與治療延至夾旬左耳下紅腫敷治未效外科用刀針割破潰爛之處最寬臭不可近咽喉口舌疱而腫紅食飲難入先是冬溫失治釀成此癰發於膽與三焦之絡皮肉潰濫尚不足慮咽喉糜腫最是堪虞不惟有形之毒火宜制尤是午後之陰熱宜防治法當以毒熱為前提而陰火預為潛伏免日後延成癆怯為患深遠也以犀角元參寸冬生地銀花連翹龜板甘草丹皮大云等出入為方調治旬余咽舌紅腫始消方能稍進稀粥危險已除也潰濫付外科敷治後又未得延成虛損幸甚春溫咳甚幾成肺癰肖季瓊素有肺燥微咳正月初覺額角頗疼咽喉頗燥食雞魚漸至痰緊失音咳甚於子夜左手脈象數而且弦右手浮洪感春溫又為飲食助燥不知額角初痛肝陽已浮又加食物燥肺清肅全失前方雖數服降利肺氣之品未得取效者其中微雜燥熱以掣其肘耳與石膏黃芩肅清肺胃為君菖蒲栝蔞薤白開通胸中之陽為臣杷葉竹茹桑皮降利肺氣為佐金鈴白芍胡麻柔肝潤血為使一劑咳減脈和二診以梔子易楝芍甘桔易山楂重清肺熱以開音聲而病無進退三診以川貝葶藶知母花粉泄肺氣清痰火而胸膈始松方不礙臥矣後以訶桔梔芩沙參花粉蛤蜊知貝為治六七劑失音始開隻日間作咳而子夜無之囑其再服毋庸另方月餘漸護全愈感冒重投麻桂傷陽鄒代億室葭月間微有寒熱頭疼眩暈僅屬感冒風寒難當傳經法治醫者動投麻桂大劑汗後病不少減脈象緩小知正已被傷而邪仍頑固晚間顯面冷額汗之危急於參蘇飲內去法夏葛根少加生附為治虛脫之形幸轉後為輔正祛邪調理兼旬之久始病減餐加月餘猶難起榻一起即軟弱難支也緣此婦素為孱弱之軀又加過汗以重傷正氣之難復也如此麻桂可不慎投哉瘡毒內陷危候歐陽祥日患瘧數月精血過傷營熱未清發瘡成板膿水極形乾澀癢痛異常用敷藥遏住瘡疥全收症現發熱咳嗽痰多痰響渴喜熱飲脈數而空指下模糊並欠胃氣是毒火內攻上刑肺金而為咳中虛不攝飲邪瀰漫而響鳴危險萬分實難措手欲扶正而內熱已熾欲苦寒則脈象難當權宜緩急與犀角地黃合降肺消毒之品苦寒一概屏除恐傷正氣也一劑而痰響不聞危險可免囑多服四帖毒熱稍清瘡必自出瘡出再從益血生津著手調治可也冬溫誤治劉雄搏葭月間耳聾痰嗽舌尖赤而津枯胸膈悶而便泄心神昏瞀午熱渴譫渴者口渴譫者亂語是兩症非一症也六脈洪而頗數必先傷思慮心陽過擾舌尖赤為心火上亢不下交又感溫邪醫多誤認前方溫燥頻投每作傷寒漏底為治不知溫為出路斷不妨乎涼解每致殆於辛溫以寒溫之病源各異也投以白虎合犀角地黃再益充液通陽之品未效良由心肝有病難任石膏之辛涼再與清營壯水潛陽鎮心為治雖有起色而津液未生又易甘涼濡潤重加洋參磨兌用甘蔗榨汁代茶而飲三日後舌始津潤夜熱方減脈象又退余方辭歸四日又發熱津枯如前熱勢有倏然來去之異知非肝火不能如是之迅速飄沒也用龍膽瀉肝一大劑熱勢退盡但舌尖仍赤乃心陽上亢投導赤湯二帖示以小溲之熱較勝於前即此火下降之兆閱日果有溺熱之說可慶神思清爽解決有期矣此後自知痛癢舌淡安穀耳聾轉聰家人反以痛癢方知疑為病進曉日病經新退何得健康如前哉從此再無枝節橫生只有日趨康復經半月始得起榻僕不能久耽時日囑請他醫善後可不僨事後詆鄙人毫無功效均屬後醫調治而起雖無關係亦可笑其無知矣肝陽及時而熾王翊臣君春初寒熱咳嗽頭疼偏左脈數而洪本似感冒風寒城中各醫均與疏散麻桂肆投甚至大汗淋漓病不少減僕以感冒系營衛之邪而起居飲食焉能如恆縱邪輕體盛病必難支且知君為肝陽素旺之體當此青帝司權難免無鳶飛魚躍之患故頭偏左痛者乃肝陽上升也寒熱時發者冒風所致也咳嗽不寧者風陽沖逆也何必營衛有邪方能致諸種現症哉法與潛陽降肺油潤息風應手而效以鱉甲龜板桑葉菊花七釐杷葉石決秦艽青蒿牡蠣等出入為方須痛懲惱怒不服溫補免助肝陽為要聞說以前累發生暈冒必留連日久方痊諸醫有作痰飲為治有滋補攻伐相療藥與病勾相背而岐豈非誅伐無過之地哉內傷肝旺土絕逝症肖忠友心腹聚瘕脘痛而嘔納食不能久停將何以生津而漸至神疲肌削面色痿黃其脈左手沉緊右手弦細木氣之披倡土氣之真陰之將竭至如此極預料危期必在明年春令乎法與建中合梅連和木土之相賊佐滋水濡肝降沖濡木燥而降逆三服無功及明年春過境聞以告急不可救藥矣暑濕留連症候鄒代巨七月間寒熱嘔吐旋變滯下又由滯下轉瘧二三發截住即已至九月僕為診治色似熏黃中有暗黑夜熱盜汗神疲食少溺短便濕為暑濕留連腸胃膠固未清發痢轉瘧已是好機醫者能於此時用辛涼以祛暑苦燥以除濕何至邪留陰分令有陰虛陽走之盜汗及夜熱等患哉又何至濕溢皮膚色似熏黃猝然現於面哉且脈象細澀陰分雖傷而滋膩宜避氣分日弱而苦寒難投與茵陳滑石釵斛牡蠣大云小麥銀花甘草丹骨二皮龜板寸冬輩出入增損調治三月餘久面部之黃浮始退暑濕瀰漫何其深哉老痰火脈症可虞鄒恆豫君久年痰喘氣滿難舒舌上常有黃黑厚苔數載未脫近來精氣神之衰憊動步之維艱更日甚一日左手脈象弦硬無情右則細澀而數肝鬱之極精血之傷胡甚也論症象痰飲素積於中陰火常烘於下數年舌苔黃黑而厚者以此緣痰為水液結成以下之陰火不斷熏蒸液氣上騰於舌而為苔垢癥結所在已非一朝一夕之故病情膠固難除可知也仿王孟英治法與洋參寸冬石英蟲草牡蠣建菖竹茹蓯蓉歸身遠志為方服二帖苔垢已薄步武稍舒便可散步市中而不覺其苦矣囑再進以斷根株俟陰火淨盡再吃溫補健運蠲痰方無耗陰之患中虛寒中吐瀉可危房侄孫甫歲余二月吐瀉兼作不渴溺多眼垂常不欲開神氣十分衰憊稟賦素虛又寒邪直中為附子理中對症因是啞科無從問切恐消息不的不妨以六和湯為前茅較為妥當時值僕有他往知此子先後二極弱料吐瀉之後必有慢脾發生開一附子理中湯囑代隆弟相機而投果至夜手足厥逆眼吊驚煩風狀已現進此湯後遂沉睡安然該家人疑為已逝欲置棺中撫之則眼開聲出始知非逝而為病退矣殊堪一笑亦未再投藥餌即慶全愈喘腫不關外邪肖君某遭失怙之悲患氣滿難臥動則更甚略不咳痰溲熱便堅面色暗慘身熱又無非時感外邪殆悲哀傷肺之候肺為氣之街職司治節失清肅則治節不行既未咳痰咯血肺無燥熱之傷也不傷亦何至喘逆而為脹滿哉然悲哀所觸氣鬱不宣又可壅而上逆豈獨風寒外束痰飲內干及形寒飲冷即可傷乎雖無客邪症候方仍不外降利肺氣為主滌痰之品概可屏除三劑腫消氣平即能起榻散步於外矣但溲熱未除又多眼糞乃兼肝鬱生火與龍膽瀉肝湯以清肝熱囑服二帖即已自以為虛劑方終遂接吃香砂六君湯一帖腫滿更甚於前聞他醫用葶藶泄肺而痊嘔脹症肝脾相賊所致匡姓婦半年來不吐則脹不脹則吐溫涼降澀久治無功脈象弦澀而數乃肝鬱火生燥而上逆胃土被乘故為嘔脹豈是客邪痰飲相攻為患哉法與小建中湯培中土之不振以御肝強佐以梅連酸苦柔木氣之披猖以安胃賊四劑而嘔吐俱平弦澀二脈不見奈此婦情性不柔負擔又重謀慮難蠲肝氣不能長舒也甫愈兼旬病仍如故益信肝為角木龍性難馴一有怫逆枝節橫生囑其頤性養情不可專恃藥餌以舒郁明年春又迎診於僕詢悉嘔吐雖停而腹脹大如抱甕矣恐單腹脹必由此而成較之去年嘔脹俱作者其病更有進也法與桂枝湯合梅連加覆花川楝橘核橘絡橘葉無非平肝氣清肝火搜肝絡為主旨四劑而脹滿全消旋得妊娠矣中痰症最盛難蠲鄒恆兌君體肥而白氣弱痰多久患言蹇失序肢體麻木不仁艱於步履能食便堅脈乃調勻緩滑非風中之候乃痰飲充滯於內外肢體尤多痰火內發於心官神明閉塞此由肥白之軀內濕素盛中氣必衰氣衰則不能行水布液為血為津所有水穀精微散而成痰成飲瀰漫於臟腑經脈隧絡之間無在非飲邪所淹及曾教從何處著手蠲除哉幸體堅脈實雖礞石滾痰亦不嫌其峻也疏二陳湯合膽星枳實竹油薑汁等煎吞滾痰丸五分服至旬余神明頗清步履稍活終以滾痰之峻再施恐至決裂易茯苓指迷丸常服較穩而且妥二年再診言語更有條緒知痰火內發已少為蠲除也仍以前方改吞礬郁丸專滌心竅中之痰涎敗血是否有效不敢預必但病情之膠固難除不過勉盡人謀以圖治只能達到小愈目的即屬幸事痰飲暴中壅閉可危歐陽彭氏婦發熱而渴痰壅氣粗手足搐搦目瞪不語醫疑為傷寒投麻杏石甘湯一劑幸無防害診得脈洪滑數神思全不清爽幸吐痰最多症屬類中儘可無虞所發搐搦目瞪之狀仍多隧絡之痰未除法宜搜剔餘邪內外務盡與溫膽湯合膽星栝蔞竹油薑汁為方一帖神思清爽各症悉退病者自述有藥到即舒之快二服遂安未另主方矣此婦痰飲類中起於暴較鄒君之痰中由來緩者治之易易也腳腫至踝陽敗可嗟陽卓斯患老痰火拾餘年咳時必至面紅筋脹苦而無奈方得痰出始松神衰氣減動步多艱壬午冬見其腳腫至踝面腫至項陽虛不移之象可嗟在法已成不治診脈六部弦數自述有熱氣一條覺自下而上其腫即甚雖元陽將敗而濕熱宜去也夫四肢為諸陽之本賴以溫肌腠煦經脈肢體方得活潑而康腳之腫象如此陽虛不移之象已露猶望有溫煦體軀之用哉勉擬治標一方以知母腹皮桑皮桂枝防己海金砂蒼朮廣皮等以去濕熱為治濕熱清再商治本之法三帖腫勢退去一半再服決不再消延至冬末土旺十八日且飲食增進自以為喜知是應土之旺氣而然並非病減食增之兆至立春日果病勢漸加食少脈微已露陽虛水腫消息權與金匱腎氣湯一劑雖小有起色亦不敢再吃因喘咳屬肺金燥熱為病恐附桂辛熱上浸別生險浪也卓斯因方效而不再與疑僕另有拖延用意背余自服三帖腫雖大退按其腳已硬而不柔此即病之變象所在腫雖退有何益哉由此足不能履地遂臥榻不起病情極形膠固況吃藥又剛愎自用即謝絕調治之責而不前矣月餘方逝寒濕將瘧症小兒宗字六月間腹痛便瀉渴飲津枯初與滲濕清暑未應迄診脈緩遲腹痛喜按是感寒濕為病雖舌燥津枯乃便泄而津液下流不可作熱灼真陰為視與附子理中有何妨礙一劑而痛泄俱無矣旬余後日作如寒似熱之狀知寒濕未盡邪將傳瘧與小柴胡湯一帖即瘥小柴胡為風寒化瘧之劑當此六月炎蒸暑濕為患似不中與今竟取效何者緣本年六月冷熱無常人多挾曠暑濕之令易為寒濕之時此子之瘧是感寒濕甚明豈可拘泥用藥乎寒濕症最劇可危鄒岐山腹脹喜按裡急便難行坐易處躁擾不寧面色黃似橘皮眼光蒙以灰翳左右脈只兩至短小澀滯不流寒濕內中胡劇脈敗堪虞幸無汗泄虛脫之形尚可希冀此素體極寒又為外濕所犯方有如是垂危之候急與生附一兩乾薑焦朮黨參減半漸進而脈漸多躁擾漸定四劑而腳冷方回諸症均已人初畏重劑難當多為掉舌不知腹內已成冰海非重溫何克有濟後自述在外涉水一次歸覺不豫由漸而劇預料為外濕所侵果爾不爽產後脹痛肝鬱陰亡王階秀室生子不祿悲抱喪明漸至腹痛而脹午熱面紅腳腫便泄數月如茲僕診脈象弦洪且數驚陽獨留而陰將竭雖盧扁再世將何以生免擬輕展氣機舒郁潛陽之法聞為前醫駁斥謂產後無實可醫理誠然也不知產後喪明肝氣被鬱而侮土土被木乘而為痛脹早宜舒郁是投和木土之相賊兼免木鬱而火生奈徒知產後多虛率投溫補肝愈補則愈橫熱得補則愈熾無怪痛脹至今有加無已倘非便泄消納其補早以告殆焉有今日階亦試服其方三劑脹痛均減再請診視脈象仍然嘆木土可和而陰亡難復病退又何益哉故示危於工人免再邀診不久即逝鬱結陰亡溫補自誤劉陽氏抱喪明之痛愁懷莫展而五志之火內蘊良深症顯午熱咳嗽舌絳津枯語蹇神呆不飢不便雖炎蒸酷暑重裘略不知溫又身似畏熱常喜招涼搖扇病情或寒或熱難以捉摸參之脈象細數而虛必由肝鬱生火真陰被其盡灼氣機凝結營衛失其流通所以重裘不溫之故真氣不行於衛分也熱見午後之由陰虛火發於陰分也津枯舌燥之症雖為火灼亦氣凝而液失輸布也由氣結而津亡其理昭昭若揭法與楝芍舒肝二冬滋液歸地養陰竹茹枇葉開降肺胃沙參菖蒲保液通陽服二帖舌頗津回語言不蹇擬重加洋參再投洽值伊夫婿自外甫歸大以方藥為不妥堅欲用耆朮桂附補陽經僕再三曉以津枯熱熾真陰將亡如再服溫燥幾希之陰必至立竭焉有生理聞之頗有覺悟不料陽氏以所服非補藥不洽意往診其脈遂以厲色相加夫婿又不為開導見成見之難除病雖可治不得不拂袖而往旬余遂逝非自誤而何暑濕挾郁釀成腫脹陽某夫婦口角爭端旋患寒熱發作有時似瘧非瘧數日即已繼而腸脹腳腫脈象緩和此感暑濕邪欲化瘧又挾肝鬱瘧不能宣遂陷陰分而為腫為脹也方擬天水散合越鞠丸舒郁利濕清暑以清滌其邪或不能清滌盡淨期化瘧而出以解決之服三帖腫退脹消遂停藥餌究未成瘧旋腫脹仍然掩纏數月未愈因人窘不能言聽計從囑請他醫調治暑熱釀毒劉姓二小孩六月間同時發熱如烙汗出溺多煩渴又甚均暑邪傳肺之侯各與白虎湯合天水散清暑滌熱旋即身涼而安該父母以為全愈不令再方謂曰病退太速恐別有蘊釀未可遽抱樂觀數日後均發熱如前一於臀上生癰一於乳上高腫暑邪釀毒而出較發癤瘡者深沉多矣該父母緩不及待毒未熟時即請外科冒用刀針二三日收口而愈旋又發熱更甚於原癰之旁又作高腫而不紅痛是毒蘊元虛難以托出戒其切忌刀針勿蹈前轍與竹葉黃耆湯托裡清解為治四劑後癰熟自潰而痊較用刀針之結果優劣何如此兩孩之病同治同亦屬罕有出痘不嘉餘毒難清陳錦星小孩出痘不嘉素耽葷酒不知自節未淨之胎毒與膏梁厚味之蘊釀由來已深故眼皮常濫而流淚頸上挾咽而生瘍聲音已破食入礙疼疑是喉癰請外科認為水蟲干蟲須吃丹藥值僕有梅城之行借宿伊家代為視之系風陽上熾鬱結頸上而生瘍糜濫喉中而有穴丹藥之治欲使喉間濫上加濫是何居心留贈消瘰湯而別囑服拾帖旬余轉身視之瘍已消至十分之八九咽喉紅腫音嘶均轉示其父母限制此兒口腹以免助熱生風否則風熱之為殃將有不可向邇者越數月又午熱音嘶儼同癆瘵頸瘍又大仍系風熱使然與楝實芍藥秦艽桑皮地骨羚羊桔梗甘草元參浙貝牡蠣夏枯等藥柔肝滌熱消風化瘰四劑而各恙冰釋矣瘄疹內蘊何久外甥二歲六月間發熱泄渴咳嗽睛紅旬余不減頗慮其危與甘寒充液肅肺涼肝其父母恐藥涼傷正只服一次何如明日即遍身紅點如粟者最多知風熱化疹透發病當自己也旋即護安甫愈兼旬又患滯下值疹後真陰未復何堪又掩沉疴此子必難再愈數日即殤風陽上逆於巔歐陽氏發熱頭暈一身肉顫醫以為虛服補中益氣二帖病本少停越四日頭偏左痛項背俱疼巔頂高腫涎沫甚多發熱肢汗脈緊而沉風陽暴發既現頭暈肉顫於先又以補中益氣提升於後安得不暈冒而增為頭痛肉顫而進為巔腫乎不知小愈數日是風陽來去無常之徵何必歸功於藥力以為病退耳法與柔肝滌熱為主治風陽上逆於巔者佐重墜品以鎮之風陽灼液成涎者佐辛燥藥以祛之囑服三帖聞即霍然未經善後想風陽未嘗無時越之虞矣脾約症候代典弟腹頗脹痛不舒小便頻數大便極艱飲食如恆脈只三至此喻氏所謂之脾約症也原脾為胃行其津液者今胃為暑濕所浸移之於脾脾遂失其輸津於上之職直裹胃液下趨膀胱不後走大腸此便艱溲多之由所在也症名脾約者是約束胃津前趨之謂法與脾約丸合溫膽湯諸品燥胃濕而起脾寒俾腑氣清而樞機自運地氣得以上升天氣方能下降則水穀精微不得盡走膀胱而為溺矣欲二陰之便溺有節亦關乎清濁之降升不乖一帖即便通溲少云所下白沫頗多又是何故示以脾家健運未能即復白沫乃精微清氣未上輸於肺乃直下大腸之故候健運復而白沫自無不足為患與補中益氣合苓夏以滌飲滲濕脾自得運而有升降矣囑多服善後無庸另方風陽上逆成形可異劉奇生君與鄙人常共居遊見其頭面常有紅光問其病因頭偏左痛咳嗽痰多自覺風從背間而上即發肩髃骨疼右寸關沉緊肺胃之氣不伸左三部緩滑痰飲之象瀰漫乃風陽最熾常戴於頭面之候也能覺得風從背上無形而成有形病情固結頗異恆常必使慣逆於上者務在折而使下方稱良治與介類潛陽為君合降肺柔肝之品為臣佐消風燥血各藥概予屏除免蹈畫蛇添足之弊囑其多服以面無紅光為度幸恪信余言數月後相晤紅光咳嗽俱無矣抑鬱驚恐將發神經陽穆清君素有怔忡現不熟睡左脈關部浮大尺寸沉小右手緩平乃因事刺激肝家受郁已深且驚恐頻傷心腎不交又極倘不急治竊恐蘊釀日錮難免不病發神經法與逍遙散以解肝鬱佐遠志菖蒲以交心腎一劑知三劑遂得熟眠肝脈之浮大不見尺寸之沉小亦調不勞餘力而痊也熱伏絡中觸之即發鄒代益弟近年來累患咯血咳嗽午熱面紅嚴似虛癆之候清之即愈究不為害壬午春偶感風寒咯血更甚且飲食兼進唇若塗朱知是外邪又觸動肺胃絡中之伏熱為病矣飲食反多進者乃胃風胃火相煽於內而然喻昌所謂風煽胃中如轉丸之捷飲食易消不得不借資於厚味設虛風止熄即清薄之味尚不易化況肥甘乎益竟喜食肥甘相煽胃中之風火已足而消化力最強也夫胃為多氣多血之海風熱披猖於內胃家經道必被其動搖經道搖血自不安於其室故從上溢出焉且肺胃有子母關係胃家有故勢必影響於肺經有母病傳子之訓因肺胃有大絡相通傳之更覺捷便所以益於血止後又傳咳嗽欲死足徵胃熱上移於肺肺失肅清故耳與清燥救肺湯取石膏能清肺胃余亦甘寒油潤可息虛風病家疑藥大涼恐傷正氣再三曉以益能多食是風煽其內之故何得視為可喜哉如是始肯服石膏二錢許一帖果得咳減脈和也倘益系虛癆咯血乃陰虛火動上刑肺金石膏豈可沾唇哉故伏熱與陰虛熱之一虛一實大相徑庭治法何可互混耳或問此種伏熱何自而來殆於外感後邪熱未清醫者恐虛即投溫補以助其虐真陰虛者即乘虛而入癆熱漸成真陰足者熱無可乘之隙遂因循留連如喪家之犬只得竄入肺胃絡中以為窠臼既入絡矣不觸發亦可相安無事倘飲食寒暑一有不慎即此伏熱之導火線而咯血咳嗽諸候盡萌代益近年來累觸累發症似虛癆一與清滌旋即護痊其根株不絕者以熱仍伏於絡也更有證明焉陽卓斯昔發背疽未熟外科肆用刀針過早熱毒未出仍留於內變為老痰火百法莫療亦是熱入肺胃絡中攻之不得清之無功補之更甚遂永為腹心橐害矣然則益之伏熱果無法以剷除乎實非消清攻奪之湯劑可能奏功惟紫雪丹善能搜剔隧絡熱邪庶可有效藥屬寒涼走竄之品無經不透無絡不通務在相機而投焉可也風濕合痹症天龍禪師一身上下走注疼痛頭暈善食後重呻吟僕以脈浮生風脈緩主濕風濕相合痹而作痛也且知平昔善飲即是生濕之媒今歲風氣流行感之遂合為患頭足腰背胸腹之間略無不痛之處者以氣血流行之經脈悉作風濕走竄之道路邪正相攻故牽引於一身表裡上下速如置郵而傳命因風性善行數變故也症兼多食者風煽胃中也裡急便難者風入大腸也況挾濕為患豈不更烈乎與楝實白芍秦艽乳寄等舒肝活絡當歸胡麻輩油潤息風杜仲利腰臍之氣延胡木香調肝家氣血為疼一劑知三劑已養皿消風以善後咳嗽狂陽莫制歐陽藝甫稍有咳嗽飲食步履如恆病輕似不介意迄診其脈象細數不下七八至之多方悉真陰有立竭之勢殊為可驚想初病即爾非由房事過傷即服溫燥所致豈可作感冒咳嗽視哉法與大補陰丸以制壯火佐二冬五味洋參以救金傷治雖合法其如狂陽莫制真陰已竭何漸至腳腫溲少咳嗽有加無已藥無小效月餘方逝肺熱頗類陰火劉工保小孩七月間發熱如烙甚於寅時苔黃口渴滯下溲多人以為癆熱骨蒸用滋陰以培火誰知是暑邪傳肺須白虎以撤熱夫十二經脈之氣血流行與十二時辰各相吻合寅時乃肺經司氣之際故到時熱甚焉肺與大腸相表裡滯下乃肺熱下移焉溲多而數乃高源有熱外水飲入隨熱下注無少停焉以上諸候皆屬於肺何必從滋陰著手施治哉與石膏知母竹葉丹皮酒芩釵斛桑骨二皮沙參等出入為方清肺滌熱而痢自己漸得護痊也酒傷手痿症廖子穆平生喜飲素嗜燒酒咳嗽痰多潮熱身痛漸手痿不用腳頗可行診其脈象澀弱似有若無雖為熱灼脈道乾澀不流總屬無神可畏疑是氣散血竭症脈兩危擬難護愈尚神清音朗似精氣神之本實未剝試為手援查閱前方姜附投之不輟胡酒家濕熱滿中醫反以辛燥助虐安得不灼筋而致痿乎前賢多為足痿立法手痿一症鮮有談及僕試略闡其義夫人水穀入胃變化精微遊溢於脾以輸肺肺氣布津以營養經脈方能肢體舉動自如百骸靈活倘陽明無清氣輸布肢體經脈盡失所養將何物以束骨而利機關乎今子穆胃中皆酒生濕熱磐據清氣全無肺受此濁熱輸將故本臟自病而為咳嗽波及經脈而為手痿也方書曰痿病皆因肺熱生陽明無病不能成旨哉言乎致痿之由盡括其中矣或曰手痿而腳頗用者又屬何因緣子穆素嗜燒酒氣乃輕清上升其熱毒必與手經上行者為患試觀好飲水酒者多病腫脹性乃重濁下降其熱毒喜與足經下行者為殃勢同性合以此較彼手痿之由不昭昭若揭乎或又問身中何以疼痛乃濕熱遍浸邪正相攻之故午後何以潮熱乃濕熱最甚灼傷陰分之由方與芩連清熱羚角舒筋歸地活血荊防消風二帖頗得熱減脈清始知熱非陰熱而潮熱之疑團可以冰釋於原方再益石膏清肺胃葛根化酒毒知母花粉除痰火坐診旬余日有起色令將生葛蒸熟每日如常嚼咽其汁從緩化除積年酒毒起見也服至三月餘久手足方能作用酒量亦減去十之七八矣囑其慎重保養二年始可轉弱為強奈嗜好頻深房事口腹盡如所好一年來枝節橫生累為治愈頃因同室操戈之故先日大怒一場異日即如前痿痛緣怒氣激動肝火橫猖莫制脈象弦洪緊數為前所未見治以大劑龍膽瀉肝及當歸蘆薈等湯其脈旋平旋旺不大減除燎原之火將何以撲之乎即辭不治越日云亡自惜竭力維持許久功歸烏有也中虛將脫歐陽老母七十餘齡久說腳軟無力行動後退不前多進十全大補甫就健康又嘔吐頭暈眉稜骨痛肢冷不食脈象遲微中氣虛寒絕脫堪畏急與桂附理中生附一兩各味均加重以進並佐當歸益血明麻祛風連服三帖始得肢溫仍脾腎雙補善後濕熱足痿化瘧方解魏毓章腳痿無力行步似拖咳嗽痰多飲食不減多醫咸作虛療補陰補陽始已嚐遍診脈浮洪實數不為指撓確屬濕熱發痿之候但脈形數大半系補藥釀成方書所載骨痿一症多屬乎虛宜補腎填精用全珍金剛丸為治無不有驗奈此症緣夙有積濕在中又感時令濕熱以合成之濕先流足致足之氣血經脈都被濕襲而不用矣脈大如此料將來腫滿之患難除初與三承氣未應繼用控涎十棗湯以攻便始泄而脈始衰究病不多愈痿軟仍然蘊熱之深概可想見然脈雖大減暫可不發腫滿濕熱根株又將何以剷除乎延至二年夏濕令重臨腫滿始應濕而發氣喘不舒又添肺氣上逆問題矣再延僕診試與五皮飲二帖旋得腫消即停藥餌示法脈轉滑細紊亂假愈可知而大恙將臨眉睫初之不信閱數日果腹大如鼓也因信任不堅遂辭調治之責經草醫神方延誤數月幸濕熱自能化瘧腫症漸無形消滅也發腫雖不出余之預料後經化瘧解邪何曾先曉愧甚此症脈象難療竟得瘧解非毓章之理數未窮何能免此危殆為之慶幸不已焉飲邪最盛症鄒季衡平生喘滿不輕出戶庭或又感外邪吐出濕痰多至盈盆盈碗日趨消瘦倦怠之鄉參蘇枳桔等湯內將半夏摘去服食已久效果毫無脈象浮緩不數症專屬乎飲邪二陳湯即可解決有餘何以一無人用耳季衡常法二陳有半夏燥肺畏之如虎請另擬方曉曰君恙為脾失健運肺失敷布水穀精微脾氣不輸於肺肺氣不能敷布於臟腑經脈以為氣為血完全聚液於中而為飲為痰也幸無火熱煎熬痰不稠黏乃是濕飲易出此非苓夏滲濕飲從何去如有僨事僕可獨任其咎焉如是始肯服京半夏一錢尤要陳之已久者一劑知二劑始加夏法進三劑而飲已全蠲遂用六君湯善後伊母感曰吾兒不死老身不至鰥獨實君所賜其實此症易治並未一費躊躇可謂得個便宜矣痢至亡陽危殆彭哲賢九月間患痢於省垣往湘雅醫院診治六日即頻於危時僕自岳州返省方負笈入城為乃弟季賢所見急扯往該院視之業已淋漓大汗肢冷如冰語聲難出脈弱如無陽將脫盡頃刻告危雖有重劑恐難及救囑乃弟急抬往原寓以便用藥緩則無濟矣不料醫院發生阻撓病者云外無空氣堅不肯出不知陽亡即死空氣豈可挽救乎乃弟見危決然抬出僕先往寓所備就回陽大劑即制生附一枚野參一技煎就法候到寓便吃洽二時許覺肢溫汗止知陽未盡去猶可招之使回陽回再投劑治痢此病之標本先後不可不知但所下純紅厥陰症象參附豈可瀆用乎後以歸芍阿膠白頭銀花藕汁地榆等出入為方月餘始護漸愈蓋哲賢入院未久即召亡陽之危料是西藥克伐太過哲賢秉賦不強難當此峻烈也不解病已危殆若此西醫猶說在院無妨出必有礙殆有挽救妙方尚未施用乎又不解哲賢愛新鮮空氣可以醫病當此九秋天氣瑟瑟金風吾著薄綿襖入院似不禦寒況病人陽氣不振置於房中只蓋薄被四面窗牖盡開放入涼風吹拂到底是寒氣乎果空氣乎對病果有益乎是有害乎不待明者當知也大抵潮流所及趨向一新西法見信於人較勝於中法已多不知西法只可醫強人皮肉有形之病不可治虛人臟腑氣化之疴病不講陰陽虛實藥不說君臣佐使無論強弱體軀治法一律故強者亦可得愈弱者深受影響而不知哲賢之病不其然乎所以用參附重劑方能救護也痢久陰傷現象鄒王氏七月患痢調治月餘日趨危篤延僕試作最後治療兼決逝期緩速症現兩顴發赤渴喜熱飲裡急後重所下純紅時欲搖扇招涼六脈細數無序閱前服方藥辛溫較多於苦寒相雜而投無有紀秩症屬久痢傷陰辛溫助熱也明甚現已陰亡陽越險象環生試為勉盡人謀照法施治病之效果斷難預期投八味地黃滋陰戀陽導龍入海即桂附引火歸原之意為治重加阿膠濡血因所下純紅耳囑投一帖如熱勢有減口不加渴可翼圖存閱日再視搖扇可少各恙仍然知陽可引之歸窟陰可從漸滋填耳三帖後各恙均減遂陸續追進其著效甚遲者是真陰不能驟長之故緣重在陰傷方致陽戴於上顴赤身熱乃陽越之徵渴喜熱飲乃內陽不足招外陽以助之象陽越由陰虛而來填陰似重於引陽其理昭然也後將原方加重地黃減用桂附服至廿余帖始得漸康幸甚痢症轉泄積滯將去劉香池紅白滯下裡急後重腹中㽲痛常喜按摩脈乃澀小不調神乃疲憊已極所服皆痢門套方芍藥湯加硝黃盪滌業經三服現煎就一劑以待投僕因脈象如此精血已傷雖積滯宜消而中氣幾將斷絕硝黃豈可再沾唇哉與附子建中湯一帖腹痛稍減兩進各恙均有起色旋易去積寬腸調氣行血諸法一日大下極多遍體為之汙穢而不自覺群驚病變擬即更醫對僕頗露不滿暫從容慰曰料是積滯大去乃病轉機何用慌張候再視脈象何如果易為緩滑調勻之象當示法明日登廁必可見糞真是積去並非病變可不害怕異日果自述汙垢不見始信余言不欺也同時香池父七十老翁亦患痢甚重群醫視為難起因屬年高難任風雨著實脈症較美於香池甚多豈可以老年論休咎乎與芍藥湯二帖遂愈痢轉泄失治而逝田達億患痢脈症不逆經僕調治甫轉滑泄積滯將去可期病減就痊不料陽悟佛備輿接診即促就道因田病轉泄雖是好機亦須照拂方免遺誤但陽家亦難推卸不得不往因留一救脫之方於伊弟手示其相機而投如病至泄瀉不止及現厥逆等情即投此附子理中湯法救其脫囑注意勿忽去後果不出所料滑泄不已該弟法所囑早置河漢坐視其變及泄至數日病不能支始飛輿接僕問其方是否已服曰未也到時已陰陽兩脫挽不及救可概矣夫痢疾脈症俱逆可危陽悟佛君暑月患痢真陰已傷渴飲身熱舌絳而干脈甚弦細而數所服皆溫補之方實者實之漸至蘊熱重重盧扁望而驚走也可慮者真陰為溫燥所耗故口渴而舌絳積滯為溫補所助愈壅塞而難疏水虧木旺脈象昭然逆症層層恐難生效只法逐漸清滌撤熱生津為主治與仲景葛根黃連黃芩湯佐生地花粉二冬石膏輩出入增損陸續繼進四日後略有轉機熱減脈平知凶危可免後稍與盪滌而積滯方除不解滯下之症動與溫補是猶溝渠未浚土石頻堆不至閉塞而死者幾希矣後為陽君慶幸曰所服補益如參耆均優清解亦屬無益幸藥品皆劣雖至僨事尚許僕施解救之可能亦屬幸事痢能多食症劉七生女孩患痢身熱後重紅白頗輕惟異常腹痛痛時即索飯吃可進大碗診脈弦細兼數系水虧木旺脾弱肝強之候非痢門套方可能收績所服調氣行血諸法與病均相背而歧何能有功惟建中湯補土平肝可療腹痛而止多餐耳夫肝木原賴腎水含濡方不致燥而橫今水既枯涸母氣不能挹注子氣拂逆而痛生焉土虛受制求援於食故餐焉土被木乘方有此症也然建中必以飴糖為君方能合法因一時莫得以糯稻根之亦著捷效吾於此又欣得一經驗焉附志以向有心耳痢久脾腎兩傷症候王某稟賦不強滯下二月餘久半屬久痢傷脾無疑醫用補中益氣殊為有見進至數帖病雖減半究一半不痊莫明其故商治於余竊思積滯未去多服參耆必至助邪而甚既得減半知積已盡去也倘徒歸咎於中虛則進參耆必克全功病尚一半不愈者必另有故存焉忽有悟曰參耆奏效已為久痢傷脾明證脾可受傷而腎家安得全不受損乎脾受傷已得參耆扶助腎受損未將何藥維持此症不收全功之故胥在乎是法與金匱腎氣囑其早服補中益氣進於晚間俾先後二天合治藥力方不致互混無功初進一帖病即如失矣夫用藥治腎並未據何種腎虛消息似跡近冒昧不知腎虛之悟機即從參耆奏效而得何必現先天摜象哉修園讀仲景書知於無字處討求奧義僕法其意法臨症亦曾於無症處以護其確息也醫豈易言哉傷於驚恐立召亡陽危殆歐陽天錫君純純發熱滑白舌苔便閉食少咳嗽痰多脈乃浮大而遲又無煩渴熱象乃溫邪順傳胃腑胃中先有痰飲盤據邪得依附之候也先經過之醫藥有用防風通聖表裡雙解者有用小柴胡湯和解少陽者均屬背謬之方毫無功效不知便結之由實關乎肺胃氣機不利升降失司何可責為熱結於腑專事盪滌哉又不知自苔之故乃邪依痰飲為山險而苔不黃燥又何可責為少陽傳經之候專事和解哉訪王孟英治法力滌痰飲開降肺胃俾飲消而邪無依附肺胃開而氣得降升便結自不通之通溫邪自不解之解也洽小愈幾日偶因縣署索餉人到不禁驚恐交集頃即大汗淋漓漸出漸冷亟亟乎有亡陽漏風之險矣時余已他往另召醫主白虎撤熱之方幸又召僕到宜急投桂枝附子湯法救護殘陽白虎決對不許沾唇彼此聚訟良久令病家方寸已亂莫知所從僕乃決然曰如吃桂附有誤惟余是問再耽時機恐陽不我留悔之何及聞此始敢煎服其藥該醫亦在此坐候休咎及見其厥回汗止始經辭去遂令余獨善其後無人掣肘矣溫症宜養陰以裕汗源房侄十齡小孩仲春患感發熱純純渴飲目赤便閉溺黃脈象洪數非傳經之候乃時感溫邪也禁投桂枝柴葛免擾無辜之經宜以甘潤養陰辛涼清肺候戰汗法解其邪為妙囑曰此孩倘忽形躁擾而渴勿用慌張可令靜臥當有汗生如呼叫頻仍恐汗出觸轉再難透發邪終內伏矣閱日果如所囑汗如雨下未甚作戰解以自汗其效亦同病即霍然此症倘施發表攻裡治法必涸汗源病愈難期未得誤藥亦此兒幸事焉外邪內熱相釀最深王永賢身頗發熱渴飲舌絳溲赤便秘咳嗽痰多常是沉沉默默之狀步履尚能支持六脈實數不為指撓蓋由平昔善飲積熱夙充又加時感客邪合而內蘊深入營分日灼真陰故舌絳而渴飲也肺金受灼水源不清故嗽痰而溲赤也身熱便閉沉沉默默諸候無非為熱極所致而然方與防風通聖相宜除卻麻黃歸術法避其溫燥重加硝黃石膏以遏其燎原服一帖登廁二次脈象稍減頃又數大如前矣因下後脈躁頗為焦慮究屬熱蘊重重藥不勝病仍法大劑續進似不畏其峻也後又更衣數次脈症大退熱不復熾遂法甘寒泄熱善後月餘復康將成肺癰症王文齋年逾耳順矍鑠體豐患咳嗽痰多腹痛喜按脈實而數右寸更洪症似外邪新感脈是肺癰將成夫肺癰多成於邪熱未清或服溫補燥肺或喜厚味釀邪金受火刑方成此候問此老先無外邪又慎口腹病情實難摸索也後聞老嫗述出虎膠伴雞蒸食方悉致病之由蓋虎屬金內應乎肺膠性溫厚非尋常草木可比一切寒濕風痹可用以追之他無所長此翁平生料多肺熱惟進清潤之品相宜今虎膠以燥益燥肺金清肅全失無敷津布液可能致有痰多咳嗽現症非止此也而腹痛之由亦是肺燥而治節不行於下致腸胃間氣均鬱悶不通通則自無疼痛之苦也法與肅肺祛痰柔肝清熱諸品頗有應驗脈象實數如此雖屬老年何妨以當歸龍薈直折其火三帖腹痛始平守服十帖病方痊愈倘徒以老年懷成見而苦寒不敢與吃將燎原之火何藥以撲滅乎肺癰之成也必矣非醫所釀而何邪傷陰絡儼似風痹劉姓小孩十二歲云膝後大筋寸長疼痛醫作風痹治之熱勢漸熾旋用硝黃盪滌通利兩次熱象稍輕恐下後傷正即與薑附溫之熱渴遂有加無已譫語搐搦之狀又蔭僕診其脈洪數而實已成狂陽難制之症似非紫雪牛黃至寶丹不能搜逐其熱邪也因藥品難得即以犀角地黃合白虎羚羊芩連輩為治毫末無功知燎原難以遏抑遂辭不治閱日云亡緣此症為陰分素虧熱邪乘虛伏於陰絡膝後筋痛即熱伏陰絡之徵也仲景曰邪之傷人有自陽受者有自陰受者此竟合陰受之旨乎又何必名為風痹哉且既知為熱與以硝黃又何必即與薑附助熱哉譫語搐搦危候實以熱助熱之功大抵今成時醫世界凡病非用薑附不能稱大藥嘗為目擊心傷焉時感鬱結兩相轇轕陽某壯丁孟春患感醫用傳經法治之頗愈總熱微氣粗久不起榻僕診其脈結小不調觀吐其氣長而不散每次視病隔榻十餘步遙覺得氣來有形症象堪奇頗費懸揣及細詰病中經過與環境情形均答以傷寒方愈又痛抱喪明知是邪感將退而鬱結加之為肝氣不舒問題矣與逍遙散三帖病勢減半再與略不再減推原其故逍遙只可解肝氣之深抑不能調肝家之陰陽仲景烏梅丸雖為吐蛔而設修園謂治肝鬱有專長不妨一試用之囑曰今日之方似與症不相吻合而實有所合者存他人不得而知勿聽阻擾是幸果二帖而餘邪悉退矣又揣其氣吐長虹之故各臟惟肝之經最長而肝之氣當亦如之況鬱而後發乎又此氣壯男兒中氣更形長大可知也夫烏梅丸調肝最善修園未闡其義殆以肝為將軍之官體陰用陽剛猛成性一有拂逆龍性難訓馭之之法剛藥以濟體陰柔藥法制用陽肝苦散用酸以收之肝苦急用辛法散之肝性剛有從治之道肝性猛有逆折之能方中寒熱互投剛柔共濟收散逆從之設備可謂完全較勝於逍遙散多矣用治陽某取效者肝為鬱結先傷邪熱未清難免無陰陽偏勝之弊一經烏梅丸委典調停安得不效如桴鼓乎肝陽偏勝者薑附務在慎施可也暑熱症誤治危候商人李某途次冒暑煩渴難眠身熱便結舌燥音無與柴葛升散已屬背謬之方況又重加乾薑不顧陰津被灼所以脈象澀小而數亦經道為熱灼不流陰亡可畏恐難再生幸小溲尚有似陰氣猶存好如旱頃之旁井泉未竭可藉為溉注之資用甘露飲加洋參花粉竹葉等味旋得舌津布滿而各症未除繼進白虎撤熱方有小應究時形譫語便結未通知燥屎塞住胃中之候與小承氣導之果下結糞五六枚而安用甘寒數帖善後遂停藥餌產後疏散真陽發外蔡澤配室產後傷寒醫用疏散法汗出不止其熱如烙業頻於危診脈浮空豁大正氣被傷邪熱猶熾治法雖產後之真陰宜顧而汗多亡陽之危在所急救也與桂枝附子湯收攝殘陽固其腠理一帖汗止熱平遂免危殆前此之熱如烙者真陽發外之象也一得附子招反其內即得熱退汗收焉易服四物柴胡湯調理經旬漸次痊愈氣鬱暑濕嘔吐症劉陽氏嘔吐三月之久兼微有似熱脈象或晝緩夜數或晝數夜緩均寓有神多投旋覆赭石湯重加牛膝為劑翼圖下降而嘔不少衰該家人疑為有孕之惡阻症也僕曰即有孕亦當為牛膝赭石所墜症雖相似揆情實無又疑脈雖陰陽顛倒尚多緩滑惡阻之脈未必無影響暫作暑濕傷胃胃氣不降以致上不能納為治與平胃合越鞠丸料加石膏清暑法夏降沖大有起色且知此婦平昔多郁肝氣不舒土木相凌症多發嘔後用越鞠合四七湯以解諸郁投八劑而嘔吐全休矣脈象滑利可嘉並不陰陽顛倒真屬有子之徵自述腹中胎已作動也深愧嘔吐未休認胎不確緣學識未到之故倘無兼症安能偽我耳目乎昔喻氏曾受婦孺之諷者大都類此醫真難為也產後發汗真陽上戴魏某室產後傷寒發熱頭痛無汗身疼其夫自命為醫見不汗出數投麻桂漸至頭面俱紅如酒醉狀延僕診視乃浮長數大之脈又是陽戴於上之症欲為援手奈徒執己見謂用麻桂何妨此喻氏所謂嬌矜不倫於理為四不治故又直諷之曰君欲法千鈞之榨壓取枯糖之油其何可得乎恐夫人禍不旋踵幸咎有攸歸也數日云亡不知產後陰虛汗源已涸宜益血養陰之不暇縱是宜發只可以柴胡四物為抽添也夫陰陽原有互根之義陽無陰則越上陰無陽亦失守雖欲微發宜先養陰不養陰而徒發安得不脫而戴上乎既戴上矣又不許設法招返且用麻桂之成見難除其何能生存哉其實戴陽較輕於亡陽之危多矣前治蔡陳氏亦因疏散而召真陽發外之險已為救護無恙胡此婦竟釀成逝症緣伊夫之自信力大過也可悲也夫疝痛自少陽傳來症陽某發熱頭疼嘔渴口苦少腹痛甚徹夜呻吟睪丸偏右墜痛茴香橘荔等藥投之無功此必不謹房勞而受外寒系厥少二經臟腑經脈合病之症也治法不謬只標本先後未分焉能生效嘔渴口苦者明明為少陽經症少腹睪丸腫痛者病在厥陰分野邪由少陽傳來也治宜先和解少陽以斷來源則痛當自已與小柴胡湯君以黃芩佐以茴香橘荔二核標本同治一劑痛休少陽諸候不見遂護痊愈夫疝瘕為病原屬於肝肝之經過小腹環陰器陰器為宗筋之府腫痛即宗筋為熱所縱也幸不見囊縮之危其熱尚淺又未見消渴吐蛔其治法又殊五苓茴香料各方後賢均為疝瘕而設可供擇用何必仲景傳經法中所有者即為採用乎溫熱症亡陰危候鄒睛南時感溫邪發熱頭痛譫語煩渴舌絳而干脈象又澀小欠神殊非善症初起禱神方治療誤用肉桂助熱更語蹇舌乾煩渴日甚幾將不起與甘露飲為大劑加洋參花粉寸冬服之舌上頗有津回欣幸真陰之未絕也多進甘寒養陰陰復得自汗而邪解病方痊愈迷信之誤可不畏哉疫症假熱真寒魏漢湘母六十餘齡閤家患疫惟母獨深視其躁擾無停衣被不許附體熱堪極矣但脈數而虛知非實熱問題乃真陽外露假象症雖為疫不可再投苦寒而溫熱亦法所宜禁故從權與白通湯一帖約二時許即見凜然畏寒知扯厚被蓋覆陽之內返何其速哉遂無過寒過熱之狀也用甘寒養陰祛邪日趨好境可期痊愈不料二子疫亡喪明之痛突上心頭病即加劇而逝亦亡之命也夫傷寒假熱真寒熏琴叔八十老人臘月感寒發熱如烙痛疼咳嗽渴喜熱飲已至痰聲曳鋸飲邪氾濫無依症成不治僕從疏散著手未效家君鶴侯老人以烙熱與熱飲屬真寒假熱之形於人參敗毒散內加入生附三錢一帖而痰鳴烙熱皆失遂慶霍然自漸手眼之不靈不及家君把握遠矣邪熱方熾口腹未慎危候歐陽某系農家窘而無知咳嗽頗久自疑為虛聞食雞鵝可以保體數餐之後音聲全無咳出皆汙黑血水胸腹痛悶難堪夜間躁擾輾轉床頭睹此危狀實慮難生幸脈雖躁疾尚覺有神且水漿猶入生機頗在胡燥熱傷肺之猛肺家治節毫無治節無而升降失司矣所以氣愆其行度而血亦乖其流通吐出汙黑者瘀而後出也夜間躁擾者血並於上也胸腹疼痛者腸胃之氣鬱悶不宣也音嘶如啞者肺氣鬱遏過甚也以上見症皆肺家一氣之愆所致治法取泄心涼肺早復清肅之權君以桑皮白芨泄肺實兼保肺虛臣法尖貝栝蔞利肺氣而開壅遏佐二冬黃芩專清肺火黃連泄心阿膠濡液三帖胸緊漸舒血水亦止語聲頗出惟夜熱未退肺火猶熾也夜熱乃肺家熱非專為陰火再於原方加骨皮梔子囑服八帖日有起色未另換方食物傷肺可不畏哉肝陽最旺服溫補取敗鄒南熏房兄平生喜酒濕熱滿中肝氣不馴常多忿怒症患腹痛足冷不便不飢又兼熱飲痰多非虛寒現象醫多誤會又自信力強吃藥只有姜附堪為對症屢進不已病狀漸加僕不忍坐視其誤曉法此症乃肝陽最旺肺胃不清何可再以辛熱助肝燥肺哉並逐條示其腹痛難忍者乃肝木乘脾之徵足冷畏寒者是陽氣盡升之咎不飢不便者乃氣機失升降之由最喜熱飲者系痰得熱有暫開之快咳嗽痰多者是津被熱灼以成其病也且云六脈浮弦而數顯非虛寒可知薑附豈可瀆用乎今君之病勢急矣不與清涼恐將不救如是始肯投石膏楝芍知母花粉尖貝竹茹桑枇二葉建菖枳椇等藥為方服後或系病藥相敵之故先夜腹痛更甚閱日早而脈症俱平矣方欣得手旋又更醫承治者以為藥到病除抱病者以為更醫即效藥之是否中肯兩不得知僕亦何便與爭得失哉所更之醫竟書溫補方而去其時未即取痙厥之禍者以清涼先將肝氣平下也誰意小愈兼旬忽抱喪明之痛肝氣被郁病仍如前自將更換醫生所開溫補方煎吃二帖閱兩日即召痙厥之危常暈倒仆地病勢遂決裂不可救藥矣嗟乎當小愈時僕之清涼方劑已生效而不自知反歸功於後醫溫補所以病翻後亦欣欣樂從其取敗也咎將誰歸雖然醫之不可為也常有過無功又何關係願世之執成見以服藥者可引為殷鑑寒邪兼房事症魏華楝君自外奔歸征塵甫卸即患腳痛頭暈咳嗽發熱沉沉默默之狀嗜臥懶言醫與疏散無效均束手不前僕診脈象浮遲問不知答觀自汗頗多大便稍結煎有硝黃待進余以感冒兼房事之症陰分已為邪乘硝黃盪滌豈不立召敗亡乎夫入房最易虛腎外邪入之乃邪乘無陰熱無所制故發熱則熱之極矣又神識何以昏沉至此者腎藏精與志精與神相依志與心相應腎虛而邪往乘之心神妙合者皆熱神為熱擾故有昏昧無知之象嗜臥者正仲景以但欲寐為少陰提綱症也昔喻氏辨認房事兼感大都類此多主麻附細辛為治此症既多自汗以麻黃易桂枝亦無不可雖方意不同主治各異究與此症暗相吻合況又有脈遲汗冷之可據也一帖熱平汗止各症俱無後以八珍湯填陰補陽日就康復不另生枝節也伏暑晚發症蕭某九月間腹脹膚腫喘咳難安身熱口渴煩躁不眠脈弦滑數之象是伏暑晚發為殃先失清滌今非化瘧而出不能解決其邪某曰曾於最近時已發瘧一次醫謂體弱難當故為截轉真個茫昧無知令伏邪閉塞其中幾有盈筐倒慙之勢治以輕展清宣法使營衛宣通方能邪化為瘧而解伊聞治法如此堅不肯從諄諄以速解速決為囑又曉之曰邪由長夏而受伏至仲秋而後發症名伏暑傷及肺金故喘且咳焉波及胃腑渴飲難臥焉侵及肌表中樞故腫且脹焉非傷寒傳經症可比又非傳經法可速愈汗吐下和均不得施治之只有清滌一法也如清滌不盡倘自能化瘧而解亦屬好機奈何醫為截住只恐再欲轉瘧而不能其人愚窘無知聞之反礙難而停藥餌專務禱祈任拖延二載倖免於死非秉賦堅強者何能受此重大病魔耳肝風症同治異歐陽松山女初手足搐搦漸一身震躍暈倒無知醒後難言抱病二月有餘調治多方罔效診其脈象結澀頗數屬肝氣不宣鬱則生風之症與癇症似是而非因無五畜之狀治以五元散即黎蘆赤小豆白礬皂角膽南星壅吐痰涎而通竅隧難言之患雖免而各恙仍然想風因火而發火得風更揚非息風清火不克有功用當歸蘆薈湯加蠍尾薑蟬為治一劑知三劑已遂得霍然而停藥餌夫此病難探處肝風雖有明候而肝火略未現形只以結澀脈象揆為木鬱生火火生而風亦隨發胥是當歸蘆薈湯之對症焉同時有魏姓小孩患此身熱一日即手足抽扯一身震動日必數發涼肝諸法投之無功油潤息風差堪對症緣此孩為稚陽之體邪得易干真陰不充邪熱無制熱可灼筋筋燥不能伸縮自如故作搐搦之狀治以油潤則血可濡筋筋舒活潑靈轉自無抽扯之虞此孩為肝血燥而生風與松山女之肝鬱生風有異也所以治法自殊汛行崩血不止症魏蕭氏汛行崩血極多發熱汗出而嘔本似血虛挾感之候醫投四物兼疏散無功不知血虛必至發熱陰虛必至陽走是以汗多雖似外邪實非外邪法舍引血歸經別無良治也欲引血而當歸即是主藥前醫曾多投不應因憶及唐容川解釋炙甘草湯即當歸一味之作用試採用之是否有效果二帖而諸症盡已殆重用地黃多汁者為血基礎少加桂枝入心化赤人參助中氣以增進水穀阿膠胡麻養血濡肝生薑辛散敷布血液合而為湯與當歸之生血引血布血濡血功用不約而同所以效如桴鼓諸醫謂僕治此症未用當歸不解其故曾舉容川之說以示不知有所悟否容川料亦有所經驗而言焉腎敗腹脹可危趙昇華久患腹脹不舒飲食步履無恙服溫補六十餘帖病不少衰僕代診之驚兩尺脈紊亂無倫根蒂已形搖動症雖宜補未得其門不知兩尺紊亂者是犯房勞之由治法宜從先天著手溫補後天何與焉且補失其所恐土愈強而水愈弱不惟無效則害將及之與金匱腎氣湯五帖兩尺紊亂之脈象已無欣幸根株已呈穩固矣略伸明腎虛何以發脹原腎與膀胱相為表裡腎氣外輸必賴膀胱氣化而出焉腎受傷損氣難收攝輸出膀胱者無所底止舊輸者未行而新輸者踵至令膀胱氣化之權不能裕如遂郁腹中而作脹矣經曰腎病者善脹與此症豈不相吻合乎腎氣湯之取效補元陰則精氣深藏補元陽則相火寧靜陰平陽秘各得權衡之妙自無外輸敗氣而作脹滿矣囑戒絕房事以杜後患為要腹中瘕聚肝鬱為患劉陽氏汛事久停疑為有孕延至十月之久尚不微動始知非胎而為病也且腹中有塊臥則可捫立則難捉症屬血瘕無疑醫為破滯攻瘀新血時流不止其塊未損毫末僕見鮮血大流有攻之不可不攻不能之勢籌思竟夜莫覓相當良方憶唐容川注鱉甲有破癥瘕積聚專長之說其理可憑其物最妥疏肝原是破積性緩無傷觀此婦情性不柔常與人有鼠牙雀角之事肝鬱必多鱉甲乃東方青色內應乎肝肝氣不疏痰飲氣食俱可鬱而為瘕也況肝血尤賴肝氣之疏方能運行有度不乖其流否則不聚而為血瘕者鮮矣遂於逍遙散內重加鱉甲予服血之已動者無妨已結者可摧蒂而脫較妥於攻血之物多也囑服十餘帖自然水到渠成願毋期速功免至僨事服至十帖忽腹痛難忍如分娩然俄而果下大塊重約兩斤劈開視之外似豬肚皮包裹一團黑血於內觀瘕結之堅牢雖用峻攻血在內深居極形穩固只新血受傷而已僕幸未蹈前弊以治易攻法而專疏肝鱉甲乃具專長耳又徵諸王氏妾病而有得焉亦情性不柔肝氣鬱結一有忿怒背惡寒而後發熱年餘以來未與治療反時增鬱怒以更傷之後於足肚上發生一癰痛極難忍魚腥發物食之遂礙久而試食甲魚癰痛反安方悟此癰殆肝氣鬱而為熱熱蒸其血以成之乎倘非甲魚疏肝食之必至痛甚也然肝鬱可以發癰方書從無載及僕於此曾悟到此關可見肝鬱發生之病端豈可限定哉痰火症變幻無常戴建先平生嗜酒嗽血痰多有年老恙頓停發生背痛嘔痰之候脈形兩手搏激而數小溲或少或多知熱在高源水道為之不調仍屬肺胃間痰熱變幻之症也夫胸背者肺之分野熱壅肺家必分野多故究莫外乎嗜酒生濕積濕為熱先由胃中不清方後及於肺故前之嗽血痰多者肺胃濕熱最充灼津以成也今以背痛嘔痰者雖病在肺之分野亦屬痰熱充滿滯而作痛溢而外出之變幻焉仿孟英肅肺蠲痰法三劑而背痛頓止易為小腹痛甚二便不通乃上熱下移兼肝火為祟與龍膽泄肝湯加硝黃二帖痛減便通而小溲點滴未有脈更弦數有加是關乎蘊熱重重頗泄而積熱初動無盪滌盡淨之能仍以前方加洋參清肺熱溲漸通而清長也大底痰熱初阻於肺漸充滿三焦往來上下而作痛龍膽泄肝湯雖名泄肝亦可泄三焦之熱異哉痰火之變幻如龍也若此中惡症情魏憩軒妾忽患神情恍惚如癡如呆為診其手時伸時縮難得脈情診至數次乍大乍小之象知為邪祟所乘即中惡症無疑也投平胃散加藿木二香辰砂明雄諸藥取氣香以勝邪色陽法制陰之義服後半日始得清醒問其何以至此曾在車米房中忽來冷風吹拂人覺不豫遂昏昧無知焉夫陰邪附體必視其陽氣不充之人方能近之而此婦陽氣可謂不振矣談鬼之說並非妄誕曾於此有實驗焉霍亂轉筋症營勇某六月間忽然腹痛嘔吐手足拘攣兩人用力欲攀開一手似屬不能且口噤不開藥不能入症屬霍亂轉筋危險萬狀僕以磁鋒刺其手指尖頭各一針出血半粒米多人即醒愈戒其停食一天少食柿餅充飢與生脈湯充養胃液不另服藥餌矣霍亂食復症唐姓小孩十二齡暑月忽吐瀉不已症屬霍亂與正氣散除生薑投之半日許即告痊愈即覺飢而飲食遂飽吃一餐當此胃氣頓傷而未復又飽食以累之安得不吐食更甚乎該家人疑是藥品有誤發生異議及曉以食復之由方告無事仍於原方內加麥芽神麯一帖就愈夫霍亂乃痧氣流行之病生薑辛散亦流行之品是宜屏除勿用凡治此症戒其愈後宜停食一天免招食復也虛癆逝症許其小愈歐陽洪慶嗽痰咳血喘滿難支倦怠遺精潮熱消瘦虛癆現象損症何多且六脈短澀精血多傷之形因真臟未見試為竭力手援似非大補氣血何克有濟詢近時所服者何乃西藥魚肝油也考此物寒潤成性多服必伐生生君之肝血雖枯頗資濡澤奈服食經年而肝木發生之機反為所遏抑要知天地一年之生髮全賴春陽人物一身之生機亦在肝木只有培之而無遏之之理金匱所云虛癆諸不足各候殆於君身備見矣豈非肝木生髮消而不長乎料君必素喜膏梁厚味煎炒炙燔之物熱積於中由來有漸灼熱成痰布滿肺胃治法不去痰則逆滿難當去之則溫燥難避咳血恐增遵仲景甘藥進食法與黃耆建中湯二劑短澀脈象易為浮緩浮乃陽象非內傷所宜換與都氣湯加沉香引氣入腎期減喘滿之苦雖有起色又轉為沉緊之脈緊乃木旺胃衰所忌尤大又改服六君加柴芍補土平肝痰喘稍平脈略濡緩矣夫脈象之變幻即元氣之支離吾曾經驗已累殊非吉兆法人參養營湯多服二拾余帖覺元氣頗振潮熱倦怠均減原賴參術輩助脾家健運水穀得增四旁飽有輸溉自無聚液成痰之患歸地等堪滋肝腎之陰筋骨賴以健強可起倦怠而無力五味子斂木氣歸根遠志肉補心氣不足藥合病情處頗多故得小效焉雖然縱費盡深心維護終莫奈此灼金吸髓之陰火何惟望此火能延成老痰火即常有煅液為痰之工作庶不致剝削元氣於無已此在延而或成之不能籍藥力法作到之奈病者無保養毅力嗜好頻仍完望有延成老痰火之餘地哉仲秋遂逝久泄症侯侄孫鄒子南患泄三年之久脈象數大堪驚初以飲留肺中令大腸不固為治與王節齋化痰丸加訶子粟殼泄勢雖減而全效難收再用去積清腸亦無效果始知根株所在系肺家積痰伏熱影響於大腸作泄無疑也用礞石滾痰丸盪滌之後方與補益收功以泄止泄期一勞永逸焉服之大泄數日已至疲憊難支積當去盡時值僕有他往易請家君鶴侯老人多投參朮耆附而瘳與鄙人先攻後補之旨若合符節焉此症參術服於未盪滌之前脈反數大者系積未去之故藥雖未效而用泄治泄之消息已明非護確息能不僨事乎久痢犯房劉某之婦滯下純紅㽲㽲腹痛為患已久經僕治療便紅大減可期全愈忽然病增倉皇迎診脈象兩尺燔亂餘部亦不甚調頗為驚訝擬為犯房勞之咎又不便明詢細詰其夫直言不諱與金匱腎氣湯加艾葉溫胞女子犯房胞宮被損而理腸風阿膠濡血而潤肝燥數帖康復如恆矣大抵房勞之脈總尺部紊亂男女皆然前診趙昇華腹脹脈象亦同此風水發腫魏姓小孩身面浮腫寒熱汗多至夜渴飲心煩脈乃浮空而數症屬表陽最虛風水渙散之候法與五皮飲治水荊防去風附子溫陽桂枝實腠一帖腫消汗止脈亦調和矣或疑風乃陽邪治以附桂似跡近冒昧不知寒熱汗多衛陽已形不固非急溫經實腠恐亡陽漏風之險立至倘陽實者附桂必增其禍也或者之疑方釋且風水為病觀風水渙之卦而可知焉即風行水上披離渙散不由經道也果衛陽不虛水行肌表陽運有權何許風與水搏激於經脈肌腠之間發為腫滿哉腎虛發腫鄒龍氏婦身面腫大脈象浮遲參之仲景五水症略無一似擬為腎虛水泛無據可憑細詰平昔果有何種病患否曰腰常痛疼現又小水頗少始知腎虛來歷有漸也與濟生腎氣湯治之一帖知數帖已夫腎者腰之腑也一失作強之能自悠悠不舉而作疼痛乃必然之勢又腎者胃之關也關門大開則水無底止而傳為消渴關門大合則水無輸泄溢於皮膚而為腫脹惟開合有度前陰利水後陰利谷胃為水穀之海方得泰然無事矣然前陰何以不利實有脾肺腎三臟之關焉閱景岳註解腎氣湯用能而可知矣方中地黃山藥丹皮養陰中真水山茱桂附助陰中陽運茯苓澤瀉利陰水遲滯使氣化於精即所以治肺也補火生土即所以治脾也壯水利竅即所以治腎也一方而兼擅數長自令氤氳氣化充滿大空水行三焦而不息矣腎虛之患既無水腫又安自來哉龍氏病情閱此便悉痰飲作喘漆商張生易與僕偶同餐宿見其痰聲漉漉喘息抬肩問患此病多年曰有生來之患也即請與方因痰涎吐盡後喘息方平明明為飲邪阻塞氣機致有此漉漉音聲急滿苦狀耳與六君湯囑其常服越年遇於途中果伸減喘之謝邪感兼鬱症情孫氏婦被雨途中寒熱咳嗽頭痛身疼漸致顴紅咯血症似虛勞延診於僕所著之人備悉此婦鬱結隱情於途中一一述出料是邪感必挾肝鬱之症也迄診其脈浮空數澀查閱前方涼血疏解治本不謬何以無功想病延三月之久縱有外邪必疏解盡淨惟鬱結問題未曾解決問其怔忡善忘否曰有之參法途中所得各說正合內經二陽之病發心脾之旨矣與歸脾湯為治伊母恐溫補助邪決不敢服再三曉以外邪已盡只心脾為思慮所傷未痊豈可再與疏散乎勉強試服一帖因有起色迭進五劑病已如失二次診時賀其母曰不僅今日病情已愈且異日熊羆有兆矣問何以知之令媛心脾受郁已久發於二陽而為病故胃少納而腸少通也今以歸脾方條達二臟之郁二陽之病已除且心主血得補則化赤之力日足脾主運得補則水穀之精日充以血生於穀也血足則衝任強胞宮旺受胎自較易易熊羆之兆由是而知甫經一年後遇此母於他處詢知孫氏於最近時果得一子母亦信前言之不謬也腎敗氣喘陳老翁粵東人年已六旬前清北京京官久患喘滿略不咳嗽步行三五氣即上奔氣海丹田幾同虛設全不為臟氣之用首經北京名醫多手又遍訪海上及湘省名醫調治所費不貲終鮮效果日頻於危時僕在省垣應診亦承招視氣息止有出無入膚冷難言便出不覺脈弱如無睹此危狀不敢主方今即見不執管遂寬之曰家君病勢至此不過聊盡人事好否無有異議也始敢作腎不納氣症醫之擬都氣湯加沉香引氣入腎一劑知三劑大有起色二次延診即能在房中行步自如當承翁法再造為感復診其脈仍是無神知病雖暫退終歸決裂無功原因腎傷過甚氣不攝收雖能引入不能久納實無復元希望也此翁腎敗之由料不出乎房事而成詢其究竟果有姬人甚麗情感最濃以召厲階也況屬老年先天已形不固又加房事催折一經敗裂豈能收拾哉此老恰小愈一月竟至不起腎虛頭痛劉芳湘頭痛頭汗最喜按摩晝輕夜重祛風補血久治無功脈乃細數無倫似無胃氣為腎虛水不含木木燥生風上逆於頭而為痛也豈六淫客邪為患乎此君素是陽虛於上之體頭汗畏風喜按乃其現象病甚於夜者因木旺由乎水虧腎水屬陰為陰邪甚於陰分之故治法何必專專以風為哉以景岳左歸飲加阿膠蓯蓉壯水之主法含肝木上之陽虛暫不兼顧倘即與參茸補上豈不助肝陽上升為患乎二帖痛止脈和即多服此湯善後候水含木靜陽不升浮再與參茸益上可也勞役傷氣長男宙英十齡小孩著其負重遠行歸即惡寒發熱倦怠懶言脈浮空大擬是客邪新感略予疏散未效頗形棘手家君鶴侯老人見其病重遂引調治責為己任將先日往外經過反復細詰到底受何種損傷答以任重道遠努力方到始知為勞役傷氣之候投補中益氣二帖即氣壯熱休無有問題矣後思此症與邪感不同處頗多頭項不痛脈象浮空金鑑明明有內傷外感辯似之條何曾悟及哉此思察欠周治難中肯附志以為忽略之戒勞役重傷危候農人某初感外邪頭疼身熱聞出汗可以愈病擬省醫藥經費為人抬柩欲借重任以壓汗出用力大過中氣被傷更發熱如烙少氣懶言已備後事矣僕聞前此經過作勞役傷氣法醫投補中益氣一帖病無增減又加重分量法進吐出瘀血甚多群疑藥必有誤發生異議紛紛曉以瘀血之出確是好機因氣傷不行血亦痹而不動今得益氣之品助氣以行氣行則血亦行焉以氣為血之帥故也並非藥之誤實藥之功病家疑竇方釋易人參養營湯善後遂愈肝火發狂陽同壽胃脘疼痛漸至狂妄無知親疏不識診脈弦細而數弦乃木鬱數乃火生細為水少乃腎陰素虧肝失濡澤又因事刺激木鬱火生漸成此狂妄無知之症也因詢及近日環境何如均示有同室操戈之事氣鬱良多又素知稟性剛介不肯下人稍有拂意最易惱羞成怒激動肝陽初之胃脘疼痛者本郁凌上也今之狂妄無知者肝火橫發也醫能於脘痛時急用柔肝泄熱開鬱補水之方何至肝火無制亢龍有悔哉肝為角木龍其性剛悍言肝火最亢且前方反多投薑附剛燥以助肝陽所以痰隨火生心竅被窒神明出入盡失靈機狂謬之症以成也與龍膽泄肝湯加硝黃盪滌直折肝火冀大泄幾次方克有濟不料病家以泄傷元氣為憂方更衣一次不許再泄不得已囑磨力參服下止之狂雖稍定旋又如前矣是火邪略經盪滌稍為戢小之故僕因掣肘辭治又堅留不許允此後任用何藥不再幹涉也復與前方盪滌始奏敷功再以硃砂安神滋陰補水加柴芍平肝善後慢脾風症陽術雲子甫三齡六月間發熱煩渴吐泄不休漸至眼吊口手足搐搦醫見險象環生紛辭治僕知是慢脾危症試為竭力手援此子首由暑濕傷胃胃中清濁相干發為吐泄緣稟賦不強過用苦寒勝熱熱未清而元氣被傷豈可不屏絕苦寒言治乎急投附子理中挽垂危之胃氣招渙散之真陽或可有濟倘猶以熱渴為實邪決無生理矣初服一帖無減添加重參附再進兩帖方有起色三四日間計吃主附四兩野參兩支可算重也夫慢脾一症之成初由吐泄罄其胃陰又加肝風來劫胃中濡潤全無故胃陽失其留浮越於外煩熱不休手足搐搦者筋失濡養也眼吊口者陽絡風乘也大抵生附溫可招浮越真陽人參甘潤可滋燥胃液陽反陰生則肝風自息慢脾之來去大都類此非然者胃陰既被吐瀉所傷再與薑附燥之能不速敗乎又同時劉姓外甥五歲發熱嘔吐不泄醫與柴葛芩連等藥又至口眼喎斜手足抽扯筋惕肉顫之狀不一而診脈虛澀而數症雖頗類慢脾實由肝寒而筋失溫煦之咎如謂胃津被劫肝陽披猖嘔渴煩熱各情都不見甚也與資壽解語湯取羚角舒筋羌防祛風竹瀝姜滑痰附子溫肝一帖風息再帖全止不用理中者因未見泄瀉只作嘔吐中氣被傷甚也偏風波及於目魏靜君頭偏左痛眼赤羞明專科與掃血退紅祛風清熱之品久治無功脈浮細數右手溢出魚際肝陽上熾症朗然矣夫肝陽何以上熾因腎水虧乏木失含濡故熯燥而逆脈象細數水虧之徵目乃肝之竅肝燥生熱眼赤羞明雖云目為五臟六腑精俱可得而病之總之竅專屬於肝其火自不離乎肝龍膽瀉肝等法殊為對症二帖脈症略減又易當歸蘆薈湯加羚角青葙數投之病減去六七總不痊愈自述風從左眼角之皮裡膜外而上痛時手捫可得據此最外一層絡中似有依山伴險之固用藥內消則藥性之透外幾希追風之力較輕且薄且頑強高亢潛上之道路已成熟竇藉據之集臼固似負隅欲黎庭掃穴斷絕風火根株實屬難事囑其培養腎陰法含木痛懲忿怒法養肝即可免及時而復之苦否則當青帝乘權竟肝陽浮動之際恐痛有不可響邇者憨直之言未必為是竟挾資遍訪中西名醫於通衢大邑終屬無功至今根株未絕間作痛楚也奇經虛損歐陽老母六十餘齡久患咯血腰腿痛疼行動欲向前往其腳只喜後行以老年氣衰血弱藥宜從補須著手於八脈之空虛腳向後行總不離陰絡之受病前賢謂陽主進陰主退其理確然也與十全大補加蓯蓉枸杞烏側龜鹿二膏補八脈即補陰絡矣數帖病除囑制丸常服毒熱內攻劉心田學博臂上生癰用藥敷治遏毒內攻頗作寒熱煩渴儼似風寒前方多主疏散藥不外麻桂羌防僕謂傳經各候斷不能飲食步履如恆為毒熱入內無疑所服者空擾毋辜之經而已對病情何與乎為主芩連清熱芍地養陰銀花甘草解毒丹皮牛子散腫排膿元參紫草入營涼血方雖未有深意亦是對症而施究執迷不悟猶以疏散為宜漸延成火毒瀰漫難以挽回悲夫蓐勞腹痛魏鄒氏產後二十餘日患腹痛甚劇最喜按摩多方未效僕謂分娩許久豈猶是惡露內攻必蓐勞犯房之症與當歸建中湯作血虛為治未應繼投當歸羊肉湯又未效調治兼旬已窮對付家君鶴侯老人示以既認為蓐勞胞宮被傷下元受損建中羊肉等法只能醫血虛腹疼何能溫胞固下所以不效惟桂附八味地黃堪為對症遵而與之數帖全愈深佩家君卓識誠不遠遜乎前賢惜未留平生醫案以受兒曹眼見取效者略舉三四宗以為案也畢生之巧發奇治豈盡為僕所見知乎腫脹將發脈象歐陽紹德君平生好酒夜寢而床下不離壺觴時適僕診病於伊弟家就察壽脈好否驚至數紊亂大小不調指下無情已極問其有何病苦否答曰無之嘆曰目下雖無恐將不免乞慎寒暑屏除嗜好以杜沉疴又問將來所發何病乎知君所好在酒早已濕熱滿中大抵濕熱為殃多不外乎腫脹範圍近所治之酒病大都如此所揣是否有應勿怪贈言之不祥談後月餘竟如所料又倉惶迎診已知病不可為不得不應召而往與五皮飲加車前防己利濕消脹一帖小便不禁嗟腎敗至如此極安有挽回餘地哉決然辭治後經多醫日就於殆方書所謂脈病而人不病號曰行屍曾於紹德之脈有經驗焉惡阻症辨認鄒魏氏嘔吐不食胃脘痛疼徹夜呻吟多醫束手試為一探原委六脈調勻神色無恙讀仲景有曰婦人得平脈陰脈小弱嘔不能食無寒熱名妊娠謂其夫曰明明已熊羆入夢何以均作病治乎倘是他恙必有色奪脈病之徵脘痛而嘔者乃肝血移作蔭胎之用則肝氣自燥肝燥上逆胃受影響而為嘔痛矣不比內傷病之木盛剋土其敗伊于胡底難免死亡之憂夫此惡阻一症一俟各臟腑擔蔭胎之敢而肝燥自除嘔痛自已也與四物濡肝血法夏降逆沖不必平肝以遏生機不必健脾以滋血燥服三帖即已胎亦逐月漸大後果一索得男幸不出所認辨也種子方累驗鄒辛儒為族中小房之一人其妻四旬無出伊親屬南熏極為觀念囑僕主方為辛妻調病期一索得男以續嗣事問及汛事差忒爽期行經腹痛等候修園謂為氣血虛損傅氏謂為肝腎氣鬱而然幸兩尺脈不見衰尚有希望暫遵陳氏主加味四物湯不予增損囑服七帖何如因家貧無力四帖即已逾二月再診尺部滑利如珠各部均調問其汛事亦停確是有子之象無法方為後果一索得男也夫加味四物善能種子久為修園嘉許之方惜未闡明其意方中以炙甘草為君培植後天多納水穀以裕生血之源四物養血而肝即以調藏血之所茯苓滲胞宮水濕而不滑香附化血中氣滯而流通陳皮疏地黃滯膩並杜炙草甘壅滋而不滯補而不凝方同有制之師矣此修園讚美於前吾濟效用於後多收響應之功但體豐多濕者必易茯苓為君可也吾謂種子詳法尤以傅氏為最切焉又胡會友妻三十六齡無出其夫商診於僕問其病情與辛妻大同小異亦疏此方與之洽一年許即願得熊羆後寄信伸謝其方始知應驗又陽同南妻年三十餘得男願切方藥遍嘗求診於僕亦血虛食少關係與加味四物果得妊娠奈分娩不順幾至凶危兒亦未育此方取效甚多豈僅此三人哉不過略舉此為證焉耳頭痛將發脈象魏鄒氏少年失偶鬱郁寡居膝下無兒負螟成祧隱曲抑鬱之情必較多於平人也延僕為伊子治病兼診自之壽脈察脈緊大有力不為指撓緊為木氣有餘良因鬱極所致又緊生病痛恐將有痛風發生囑慎憂思喜怒及風寒暑濕免召沉疴也逾二月果患頭痛最甚多方調治無功至一年久痛未少停殊可憫惻因藥治未效只有參禪理佛或可怡情亦是條達肝氣之一法因遵而行之聞頭痛已愈月餘期根株斷絕忽為家事觸怒遂痛甚而莫可挽救矣預料此婦多是發生風痹或偏枯等候初未料及於頭痛焉且料其一發而難以藥為也亦屬不爽暑濕將瘧延誤而逝鄒代欽五月間行賈洪江感受暑濕寒熱頭疼嗽痰嘔泄醫與疏散未效恐是虛寒而投溫補泄雖小止轉為嗽血漸成不瀉則脹不脹則泄潮熱盜汗小溲短少諸候七月歸家延僕療治其脈左寸沉小尺部洪大右寸關較左更數洪明明吸暑傷肺之症不惟未與清滌反以溫補治虛病轉咳血肺燥又加也不知泄乃肺熱下趨可為邪之出路何必沾沾以虛寒是慮哉肺熱之上又加以溫燥助之故清肅全無水源日涸將何作水液下行通調於膀胱乎此小溲最少之由也肺與太陽相為表裡其燥熱有加無已雖自走大腸而作泄可減輕肺邪究之泄久傷陰陰傷致發生潮熱盜汗問題且將延成虛損勞怯之患法與洋參梔芩清肺扁豆滑石滌暑牡蠣骨皮止汗蓯蓉龜板顧陰青蒿白薇治洗洗寒熱藥無溫燥助邪又無苦寒傷正陸續漸服一俟真陰頗振營衛自通暑濕之邪或化瘧而解或清滌而瘥病有解決之期矣服二帖果爾畏寒尚未作戰化瘧之兆已萌但未能成瘧而解各症遂有減輕之美焉方欣得手病有轉機擬促其再進原方推瘧速成奈病家專務祈禱竟停醫藥延至兼旬病又如前之重更醫治療所服不離淮山苡米佐以常山草果原思健脾兼以截瘧主治之旨如此暑濕蘊釀從何解決乎坐視延誤日久轉瞬駒光又易除舊更新立春後幾日病遂有加無已欲再轉瘧何能哉遂逝周痹症候劉克猷之女孩八歲發熱頭疼汗出醫與疏散病易腹疼並下身不能移動乃左右不移上下行之周痹症也風為六淫之首善行數變初苦頭痛是風熾於上旋變腹痛乃風邪下行何以不左右移乎但隨經之上下為病不隨絡之橫斜為殃只得稱為風痹其害遠遜乎風中也與附子當歸建中湯扶土抑木以治腹疼溫經實腠以止汗漏一帖諸症皆平惟舌燥汗多風熱餘波尚熾再與養血生津消風固表漸得收功吐血有期症廖迪凡年少好飲兩月吐紅一次漸又嗽血痰多脈象弦數右手更洪症屬酒家濕熱蘊釀胃中繼傳及肺清肅受傷之候也首與清肺祛痰而咳嗽有減繼進清胃醒酒而吐紅漸除迭投三四十帖尚未收全績可知蘊熱之深已非一朝一夕之故非戒飲斷房欲掃除痼疾實難也酒風戰掉袁慶喜辛苦人四肢戰掉行動維艱脈象緩滑濕飲之徵經曰諸風戰掉皆屬於肝論症乃風淫論脈為飲患殆屬風陽挾飲堵塞經脈隧絡之間以致筋骨無清氣營養皆濁熱所浸淹安能有舒展自如之快哉法與祛風滌飲活絡舒筋為方數帖極為得手奈家貧無力吃藥又不能靜養其疴實感根株不能斷絕之困難殊為惻然耳
